site_name: pyfossil Documentation
site_description: High-Performance Multiphase & Foam Flow Simulation in Porous Media
site_author: Filipe F. de Paula, Thiago Quinelato, Iury Igreja
site_url: https://fylype.github.io/pyfossil/

repo_name: fylype/pyfossil
repo_url: https://github.com/fylype/pyfossil

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - Python API Reference: python_api_reference.md
  - Solvers & Numerical Methods: solvers_and_numerics.md
  - Tutorials & Benchmarks: tutorials_guide.md
  - Visualization Guide: plotter_guide.md
